services:
  orbita-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: orbita-aeci-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    networks:
      - orbita-network

networks:
  orbita-network:
    external: true
